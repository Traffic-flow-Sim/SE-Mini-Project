
name: Traffic Management System CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile integrated application
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            main.c queue.c -o traffic_management

      - name: Run application smoke test
        run: |
          printf "1\n1\n" | timeout 10s ./traffic_management

      - name: Compile queue tests
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            tests/test_queue.c queue.c -o test_queue

      - name: Run queue tests
        run: ./test_queue
