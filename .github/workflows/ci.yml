
name: Traffic Management System CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile simulation
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic \
            -Werror traffic_simulation.c \
            -o traffic_simulation

      - name: Run simulation
        run: ./traffic_simulation
